name: python_bindings

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v2
      - uses: cvmfs-contrib/github-action-cvmfs@v2
      - uses: aidasoft/run-lcg-view@v3
        with:
          release-platform: "LCG_101/x86_64-centos7-gcc10-opt"
          run: |
            mkdir build install
            cd build
            cmake -DCMAKE_CXX_STANDARD=17 \
              -DBUILD_ROOTDICT=ON \
              -DCMAKE_CXX_FLAGS="-fdiagnostics-color=always" \
              -DCMAKE_INSTALL_PREFIX=../install \
              -G Ninja \
              ..
            ninja -k0 install
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: lcio-install-dir
          path: ${GITHUB_WORKSPACE}/install

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Necessary to have GITHUB_WORKSPACE defined
      - uses: actions/checkout@v2
      - name: Remove checkout
        run: rm -rf ${GITHUB_WORKSPACE}/*
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: lcio-install-dir
          path: ${GITHUB_WORKSPACE}/install
      - uses: cvmfs-contrib/github-action-cvmfs@v2
      - uses: aidasoft/run-lcg-view@v3
        with:
          release-platform: "LCG_101/x86_64-centos7-gcc10-opt"
          run: |
            export LCIO=${GITHUB_WORKSPACE}/install
            export LD_LIBRARY_PATH=$LCIO/lib64:$LD_LIBRARY_PATH
            export PYTHONPATH=$LCIO/python:$PYTHONPATH
            python $LCIO/python/examples/EventBuilder.py test.slcio 1
